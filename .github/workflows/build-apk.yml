# Build APK manual: Actions -> "Build APK (manual)" -> Run workflow.
# Hasil APK (debug, sudah ditandatangani otomatis) ada di bagian Artifacts pada halaman run.
name: Build APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gps-setter-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
